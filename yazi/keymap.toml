#:schema https://yazi-rs.github.io/schemas/keymap.json

[mgr]
prepend_keymap = [
  { on = "<C-u>", run = "arrow -50%", desc = "Move cursor up 1/2 page" },
  { on = "<C-d>", run = "arrow 50%", desc = "Move cursor down 1/2 page" },
  { on = "<C-b>", run = "seek -10", desc = "Seek up 10 units in the preview" },
  { on = "<C-f>", run = "seek 10", desc = "Seek down 10 units in the preview" },
  { on = "!", run = 'shell "$SHELL" --block', desc = "Open shell here" },
  { on = [
    "g",
    "p",
  ], run = "cd ~/Projects", desc = "Go to ~/Projects" },
]
